<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JobSend Pro — Multi-Profile</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Literata:ital,wght@0,300;0,400;0,500;1,300;1,400&display=swap');

:root {
  --bg: #0a0a10;
  --surface: #13131c;
  --surface2: #1a1a26;
  --border: #252535;
  --text: #e8e8f2;
  --muted: #60607a;
  /* Profile colours - overridden per profile */
  --pc: #4fffb0;
  --pc-dim: rgba(79,255,176,0.08);
  --pc-border: rgba(79,255,176,0.2);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Literata', Georgia, serif; background: var(--bg); color: var(--text); min-height: 100vh; }

/* ── TOP BAR ── */
.topbar {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: stretch;
  height: 56px;
  position: sticky;
  top: 0;
  z-index: 100;
}
.topbar-logo {
  padding: 0 24px;
  display: flex;
  align-items: center;
  border-right: 1px solid var(--border);
  font-family: 'Syne', sans-serif;
  font-weight: 800;
  font-size: 1.2rem;
  letter-spacing: -0.5px;
  color: var(--text);
  white-space: nowrap;
}
.topbar-logo span { color: #4fffb0; }
.topbar-logo small { font-size: 0.6rem; color: var(--muted); margin-left: 6px; letter-spacing: 2px; text-transform: uppercase; }

/* Profile tabs */
.profile-tabs {
  display: flex;
  align-items: stretch;
  flex: 1;
  overflow-x: auto;
}
.ptab {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 22px;
  cursor: pointer;
  border-right: 1px solid var(--border);
  border-bottom: 3px solid transparent;
  font-family: 'Syne', sans-serif;
  font-weight: 700;
  font-size: 0.82rem;
  color: var(--muted);
  transition: all 0.15s;
  white-space: nowrap;
  position: relative;
}
.ptab:hover { background: var(--surface2); color: var(--text); }
.ptab.active { color: var(--text); background: var(--bg); }
.ptab .pdot {
  width: 9px; height: 9px; border-radius: 50%;
  background: currentColor;
  opacity: 0.5;
  transition: opacity 0.15s;
}
.ptab.active .pdot { opacity: 1; box-shadow: 0 0 8px currentColor; }
.ptab .pbadge {
  font-size: 0.65rem; padding: 1px 6px; border-radius: 10px;
  background: currentColor; font-weight: 800;
  display: none;
}
.ptab .pbadge span { color: var(--bg); mix-blend-mode: normal; position: relative; }

.topbar-right {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 20px;
  border-left: 1px solid var(--border);
}
#user-pill {
  font-size: 0.72rem;
  color: #4fffb0;
  font-family: 'Syne', sans-serif;
  display: none;
  background: rgba(79,255,176,0.08);
  padding: 4px 10px;
  border-radius: 20px;
  border: 1px solid rgba(79,255,176,0.2);
}

/* ── LAYOUT ── */
.app { display: grid; grid-template-columns: 230px 1fr; min-height: calc(100vh - 56px); }

/* Sidebar */
.sidebar {
  background: var(--surface);
  border-right: 1px solid var(--border);
  padding: 16px 12px;
  display: flex;
  flex-direction: column;
  gap: 2px;
  position: sticky;
  top: 56px;
  height: calc(100vh - 56px);
  overflow-y: auto;
}
.sb-section { font-family: 'Syne', sans-serif; font-size: 0.62rem; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); padding: 12px 8px 5px; }
.nav-item {
  display: flex; align-items: center; gap: 9px; padding: 9px 10px;
  border-radius: 7px; cursor: pointer; font-size: 0.81rem; color: var(--muted);
  transition: all 0.15s; font-family: 'Syne', sans-serif; font-weight: 600;
  border: 1px solid transparent;
}
.nav-item:hover { background: var(--surface2); color: var(--text); }
.nav-item.active { background: var(--pc-dim); color: var(--pc); border-color: var(--pc-border); }
.nav-item .ico { font-size: 0.88rem; width: 16px; text-align: center; }
.nav-badge { margin-left: auto; font-size: 0.66rem; padding: 1px 6px; border-radius: 10px; font-weight: 700; display: none; }
.nb-a { background: var(--pc); color: var(--bg); }
.nb-w { background: #ffd166; color: #0a0a10; }

.sb-footer {
  margin-top: auto;
  padding: 12px 8px;
  border-top: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  gap: 5px;
}
.sf-row { font-size: 0.72rem; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.dot { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); flex-shrink: 0; }
.dot.on { background: var(--pc); box-shadow: 0 0 5px var(--pc); }

/* Main */
.main { padding: 28px 32px; overflow-y: auto; max-height: calc(100vh - 56px); }
.panel { display: none; }
.panel.active { display: block; animation: fi 0.18s ease; }
@keyframes fi { from{opacity:0;transform:translateY(5px)} to{opacity:1;transform:translateY(0)} }

/* Profile header strip */
.profile-strip {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 14px 18px;
  border-radius: 10px;
  margin-bottom: 22px;
  border: 1px solid var(--pc-border);
  background: var(--pc-dim);
}
.profile-strip .picon { font-size: 1.8rem; }
.profile-strip .pname { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 1.1rem; color: var(--pc); }
.profile-strip .ptag { font-size: 0.75rem; color: var(--muted); }
.profile-strip .pedit { margin-left: auto; }

.panel-title { font-family: 'Syne', sans-serif; font-size: 1.3rem; font-weight: 800; margin-bottom: 3px; }
.panel-subtitle { color: var(--muted); font-size: 0.82rem; margin-bottom: 20px; font-style: italic; }

.card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 20px; margin-bottom: 16px; }
.card-title { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 0.9rem; margin-bottom: 3px; }
.card-desc { font-size: 0.78rem; color: var(--muted); margin-bottom: 14px; line-height: 1.5; }

label { display: block; font-family: 'Syne', sans-serif; font-size: 0.66rem; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); margin-bottom: 5px; margin-top: 13px; }
label:first-of-type { margin-top: 0; }
input[type=text],input[type=email],input[type=password],input[type=number],textarea,select {
  width: 100%; padding: 9px 12px; background: var(--bg); border: 1px solid var(--border);
  border-radius: 7px; color: var(--text); font-family: 'Literata',serif; font-size: 0.84rem; outline: none; transition: border-color 0.15s;
}
input:focus,textarea:focus,select:focus { border-color: var(--pc); box-shadow: 0 0 0 2px var(--pc-dim); }
textarea { resize: vertical; min-height: 150px; line-height: 1.7; }

.btn { display: inline-flex; align-items: center; gap: 7px; padding: 9px 18px; border: none; border-radius: 7px; font-family: 'Syne', sans-serif; font-size: 0.8rem; font-weight: 700; cursor: pointer; transition: all 0.15s; text-decoration: none; }
.btn-p { background: var(--pc); color: var(--bg); }
.btn-p:hover { filter: brightness(1.1); transform: translateY(-1px); }
.btn-outline { background: transparent; color: var(--text); border: 1px solid var(--border); }
.btn-outline:hover { border-color: var(--pc); color: var(--pc); }
.btn-warn { background: rgba(255,209,102,0.1); color: #ffd166; border: 1px solid rgba(255,209,102,0.3); }
.btn-warn:hover { background: rgba(255,209,102,0.2); }
.btn-danger { background: rgba(255,107,107,0.1); color: #ff6b6b; border: 1px solid rgba(255,107,107,0.3); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none !important; filter: none !important; }
.btn-row { display: flex; gap: 9px; margin-top: 16px; flex-wrap: wrap; align-items: center; }

.google-btn { display: flex; align-items: center; gap: 11px; background: white; color: #333; border: none; border-radius: 7px; padding: 10px 16px; font-family: 'Syne', sans-serif; font-weight: 600; font-size: 0.85rem; cursor: pointer; transition: all 0.15s; box-shadow: 0 2px 8px rgba(0,0,0,0.3); }
.google-btn:hover { transform: translateY(-1px); }
.google-btn svg { width: 17px; height: 17px; }

.info-box { background: var(--pc-dim); border: 1px solid var(--pc-border); border-radius: 8px; padding: 12px 15px; font-size: 0.79rem; line-height: 1.7; margin-bottom: 13px; color: var(--text); opacity: 0.9; }
.warn-box { background: rgba(255,209,102,0.06); border: 1px solid rgba(255,209,102,0.25); border-radius: 8px; padding: 12px 15px; font-size: 0.79rem; line-height: 1.7; margin-bottom: 13px; color: #f0d890; }
code { background: rgba(255,255,255,0.08); padding: 1px 5px; border-radius: 3px; font-family: monospace; font-size: 0.78rem; }

.file-drop { border: 2px dashed var(--border); border-radius: 9px; padding: 28px; text-align: center; cursor: pointer; transition: all 0.2s; background: var(--bg); }
.file-drop:hover,.file-drop.over { border-color: var(--pc); background: var(--pc-dim); }
.file-drop .icon { font-size: 2.2rem; margin-bottom: 7px; }
.file-drop p { color: var(--muted); font-size: 0.83rem; }
.file-drop strong { color: var(--pc); }
.file-chosen { margin-top: 8px; font-size: 0.79rem; color: var(--pc); font-family: 'Syne', sans-serif; font-weight: 600; }

.stats-row { display: grid; grid-template-columns: repeat(4,1fr); gap: 12px; margin-bottom: 20px; }
.stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 9px; padding: 14px; text-align: center; }
.stat-card .num { font-family: 'Syne', sans-serif; font-size: 1.7rem; font-weight: 800; display: block; margin-bottom: 2px; }
.stat-card .lbl { font-size: 0.65rem; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; font-family: 'Syne', sans-serif; }

.tbl-wrap { overflow-x: auto; border-radius: 9px; border: 1px solid var(--border); }
table.tbl { width: 100%; border-collapse: collapse; font-size: 0.79rem; }
.tbl th { background: var(--surface2); color: var(--muted); font-family: 'Syne', sans-serif; font-size: 0.64rem; letter-spacing: 1.5px; text-transform: uppercase; padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border); white-space: nowrap; }
.tbl td { padding: 8px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
.tbl tr:last-child td { border-bottom: none; }
.tbl tr.r-sent td { background: rgba(79,255,176,0.03); }
.tbl tr.r-fu td { background: rgba(255,209,102,0.04); }
.tbl tr:hover td { background: var(--surface2); }
.tbl input[type=checkbox] { accent-color: var(--pc); width: 13px; height: 13px; cursor: pointer; }

.pill { display: inline-flex; align-items: center; gap: 3px; padding: 2px 8px; border-radius: 20px; font-family: 'Syne', sans-serif; font-size: 0.64rem; font-weight: 700; letter-spacing: 0.3px; white-space: nowrap; }
.pp { background: rgba(79,255,176,0.12); color: #4fffb0; border: 1px solid rgba(79,255,176,0.3); }
.pf { background: rgba(116,185,255,0.12); color: #74b9ff; border: 1px solid rgba(116,185,255,0.3); }
.pw { background: rgba(255,209,102,0.12); color: #ffd166; border: 1px solid rgba(255,209,102,0.3); }
.pr { background: rgba(255,107,107,0.12); color: #ff6b6b; border: 1px solid rgba(255,107,107,0.3); }
.pm { background: rgba(107,107,136,0.15); color: var(--muted); border: 1px solid var(--border); }
.pi { background: rgba(253,203,110,0.15); color: #fdcb6e; border: 1px solid rgba(253,203,110,0.3); }
.pdue { background: rgba(255,107,107,0.1); color: #ff6b6b; border: 1px solid rgba(255,107,107,0.25); animation: pulse 2s infinite; }
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.55}}

.progress-wrap { background: var(--surface2); border-radius: 6px; height: 6px; overflow: hidden; margin: 12px 0 5px; }
.progress-bar { height: 100%; background: linear-gradient(90deg, var(--pc), #06d6a0); border-radius: 6px; transition: width 0.4s ease; width: 0%; }
.progress-label { font-size: 0.76rem; color: var(--muted); font-family: 'Syne', sans-serif; }

.send-log { background: #060610; border: 1px solid var(--border); border-radius: 7px; padding: 12px; font-family: 'Courier New', monospace; font-size: 0.74rem; max-height: 200px; overflow-y: auto; line-height: 1.9; margin-top: 12px; display: none; }
.lok{color:#4fffb0;}.lerr{color:#ff6b6b;}.lsk{color:#ffd166;}.linf{color:var(--muted);}

.var-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px;}
.chip{background:var(--pc-dim);border:1px solid var(--pc-border);color:var(--pc);padding:2px 8px;border-radius:20px;font-size:0.71rem;font-family:monospace;cursor:pointer;transition:all 0.15s;}
.chip:hover{background:rgba(79,255,176,0.18);}

.col-mapper{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
.col-row{display:flex;align-items:center;gap:7px;}
.col-row span{color:var(--muted);width:130px;flex-shrink:0;font-family:'Syne',sans-serif;font-size:0.64rem;letter-spacing:0.5px;text-transform:uppercase;}
.col-row select{flex:1;margin:0;}

/* Combined tracker */
.tracker-section { margin-bottom: 24px; }
.tracker-section h3 { font-family: 'Syne', sans-serif; font-size: 0.85rem; font-weight: 700; margin-bottom: 14px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
.tracker-bar-row{display:flex;align-items:center;gap:10px;margin-bottom:9px;}
.tracker-bar-label{font-family:'Syne',sans-serif;font-size:0.72rem;font-weight:600;width:85px;flex-shrink:0;}
.tracker-bar-track{flex:1;background:var(--surface2);border-radius:4px;height:8px;overflow:hidden;}
.tracker-bar-fill{height:100%;border-radius:4px;transition:width 0.6s ease;}
.tracker-bar-count{font-family:'Syne',sans-serif;font-size:0.72rem;font-weight:700;width:22px;text-align:right;flex-shrink:0;}

/* Profile name editor modal */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:200;align-items:center;justify-content:center;}
.modal-bg.open{display:flex;}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:28px;width:380px;max-width:90vw;}
.modal h3{font-family:'Syne',sans-serif;font-weight:800;margin-bottom:16px;}
.color-swatches{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px;}
.swatch{width:28px;height:28px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:all 0.15s;}
.swatch.sel{border-color:white;transform:scale(1.2);}

@media(max-width:768px){
  .app{grid-template-columns:1fr;}
  .sidebar{display:none;}
  .main{padding:16px 12px;max-height:none;}
  .stats-row{grid-template-columns:repeat(2,1fr);}
}
</style>
</head>
<body>

<!-- Profile name editor modal -->
<div class="modal-bg" id="edit-modal">
  <div class="modal">
    <h3>Edit Profile</h3>
    <label>Profile Name</label>
    <input type="text" id="edit-name" placeholder="e.g. Support Worker" />
    <label>Icon (emoji)</label>
    <input type="text" id="edit-icon" placeholder="e.g. 🏥" maxlength="2" style="max-width:80px;" />
    <label>Colour</label>
    <div class="color-swatches" id="color-swatches"></div>
    <div class="btn-row" style="margin-top:20px;">
      <button class="btn btn-p" onclick="saveProfileEdit()">Save</button>
      <button class="btn btn-outline" onclick="closeModal()">Cancel</button>
    </div>
  </div>
</div>

<!-- Top bar -->
<div class="topbar">
  <div class="topbar-logo">Job<span>Send</span> <small>PRO</small></div>
  <div class="profile-tabs" id="profile-tabs"></div>
  <div class="topbar-right">
    <span id="user-pill"></span>
    <button class="google-btn" onclick="initAuth()" id="signin-btn" style="padding:7px 14px;font-size:0.78rem;">
      <svg viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
      Sign in
    </button>
    <button class="btn btn-danger" onclick="signOut()" id="signout-btn" style="display:none;padding:7px 14px;font-size:0.78rem;">Sign Out</button>
  </div>
</div>

<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main" id="main-area"></main>
</div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
// ══════════════════════════════════════════════════════
// PROFILES CONFIG
// ══════════════════════════════════════════════════════
const COLORS = ['#4fffb0','#74b9ff','#ffd166','#ff6b6b','#a29bfe','#fd79a8','#55efc4','#fdcb6e'];
const DEFAULT_PROFILES = [
  { id:'p1', name:'Support Worker', icon:'🏥', color:'#4fffb0', sheetTab:'SupportWorker',
    tpl:{ name:'', phone:'', subject:'Application for {jobtitle} — {company}',
          body:`Dear Hiring Manager at {company},\n\nI am writing to express my strong interest in the {jobtitle} position at {company} in {suburb}. I am a dedicated Disability and Aged Care Support Worker based in Doveton, Victoria (3177), with experience providing person-centred care.\n\nI hold current certifications including a Working With Children Check, Police Check, and First Aid Certificate. I am experienced in NDIS frameworks, medication management, and supporting individuals with complex needs.\n\nPlease find my resume attached. I look forward to discussing how I can contribute to {company}.\n\nKind regards,\n[YOUR_NAME]\n[YOUR_PHONE]`,
          fuSubject:'Following Up — {jobtitle} at {company}',
          fuBody:`Dear Hiring Manager at {company},\n\nI hope this message finds you well. I am following up on my application for the {jobtitle} position submitted {days} days ago.\n\nI remain very keen on the opportunity and would welcome the chance to discuss my suitability further.\n\nKind regards,\n[YOUR_NAME]\n[YOUR_PHONE]`,
          fuDays: 7 } },
  { id:'p2', name:'Factory Worker', icon:'🏭', color:'#74b9ff', sheetTab:'Factory',
    tpl:{ name:'', phone:'', subject:'Application for {jobtitle} — {company}',
          body:`Dear Hiring Manager at {company},\n\nI am writing to apply for the {jobtitle} role at {company} in {suburb}. I am a reliable and hardworking individual based in Doveton, Victoria, with a strong work ethic and ability to follow safe work procedures.\n\nI am physically fit, punctual, and experienced in working in fast-paced environments. I hold a current Police Check and am available for immediate start.\n\nPlease find my resume attached for your consideration.\n\nKind regards,\n[YOUR_NAME]\n[YOUR_PHONE]`,
          fuSubject:'Following Up — {jobtitle} Application at {company}',
          fuBody:`Dear Hiring Manager at {company},\n\nI am following up on my application for the {jobtitle} position submitted {days} days ago. I remain very interested in this opportunity and am available for an immediate start.\n\nKind regards,\n[YOUR_NAME]\n[YOUR_PHONE]`,
          fuDays: 7 } },
  { id:'p3', name:'Profile 3', icon:'💼', color:'#ffd166', sheetTab:'Profile3',
    tpl:{ name:'', phone:'', subject:'Application for {jobtitle} — {company}',
          body:`Dear Hiring Manager at {company},\n\nI am writing to apply for the {jobtitle} position at {company} in {suburb}. I am eager to contribute my skills and experience to your team.\n\nPlease find my resume attached. I look forward to hearing from you.\n\nKind regards,\n[YOUR_NAME]\n[YOUR_PHONE]`,
          fuSubject:'Following Up — {jobtitle} at {company}',
          fuBody:`Dear Hiring Manager at {company},\n\nI am following up on my {jobtitle} application submitted {days} days ago. I remain very interested in this role.\n\nKind regards,\n[YOUR_NAME]\n[YOUR_PHONE]`,
          fuDays: 7 } },
];

// ══════════════════════════════════════════════════════
// STATE
// ══════════════════════════════════════════════════════
const G = {
  token: null, userEmail: null,
  sheetId: '', headerRow: 1,
  headers: [],
  profiles: JSON.parse(JSON.stringify(DEFAULT_PROFILES)),
  activeProfile: 0,
  // Per-profile data (indexed 0,1,2)
  pd: [
    { colMap:{company:'',email:'',jobtitle:'',suburb:'',notes:'',status:'',sentAt:'',replyStatus:'',fuStatus:'',fuAt:''}, jobs:[], resumeB64:null, resumeFile:'resume.pdf', history:[] },
    { colMap:{company:'',email:'',jobtitle:'',suburb:'',notes:'',status:'',sentAt:'',replyStatus:'',fuStatus:'',fuAt:''}, jobs:[], resumeB64:null, resumeFile:'resume.pdf', history:[] },
    { colMap:{company:'',email:'',jobtitle:'',suburb:'',notes:'',status:'',sentAt:'',replyStatus:'',fuStatus:'',fuAt:''}, jobs:[], resumeB64:null, resumeFile:'resume.pdf', history:[] },
  ],
  activePanel: 'setup',
  editingProfile: 0, editingColor: COLORS[0],
};

function P() { return G.profiles[G.activeProfile]; }
function PD() { return G.pd[G.activeProfile]; }
function PT() { return P().tpl; }

// ══════════════════════════════════════════════════════
// RENDER SHELL
// ══════════════════════════════════════════════════════
function renderShell() {
  // Profile tabs
  const tabsEl = document.getElementById('profile-tabs');
  tabsEl.innerHTML = G.profiles.map((p,i)=>`
    <div class="ptab ${i===G.activeProfile?'active':''}" id="ptab-${i}"
         onclick="switchProfile(${i})"

function applyProfileTheme() {
  const c = P().color;
  const r = document.documentElement.style;
  r.setProperty('--pc', c);
  r.setProperty('--pc-dim', hexToRgba(c,0.07));
  r.setProperty('--pc-border', hexToRgba(c,0.22));
}

function hexToRgba(hex,a) {
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}

}

function initAuth() {
  const cid = (document.getElementById('client-id')||document.getElementById('client-id')).value||G.clientId||'';
  const inputEl = document.getElementById('client-id');
  const cid2 = inputEl ? inputEl.value.trim() : G.clientId;
  if (!cid2) { alert('Enter your Client ID first.'); return; }
  G.clientId = cid2;
  const client = google.accounts.oauth2.initTokenClient({
    client_id: cid2,
    scope: 'https://www.googleapis.com/auth/gmail.send https://www.googleapis.com/auth/spreadsheets https://www.googleapis.com/auth/userinfo.email',
    callback: async res => {
      if (res.error) { const el=document.getElementById('auth-result'); if(el) el.innerHTML=`<span style="color:#ff6b6b">❌ ${res.error}</span>`; return; }
      G.token = res.access_token;
      try { const r=await gFetch('https://www.googleapis.com/oauth2/v2/userinfo'); const d=await r.json(); G.userEmail=d.email; } catch(e){}
      const pill=document.getElementById('user-pill'); pill.style.display='block'; pill.textContent=G.userEmail;
      document.getElementById('signin-btn').style.display='none';
      document.getElementById('signout-btn').style.display='inline-flex';
      const el=document.getElementById('auth-result'); if(el) el.innerHTML=`<span style="color:var(--pc)">✓ Signed in as ${G.userEmail}</span>`;
      updateSidebar();
    }
  });
  client.requestAccessToken();
}
function signOut(){G.token=null;G.userEmail=null;document.getElementById('user-pill').style.display='none';document.getElementById('signin-btn').style.display='flex';document.getElementById('signout-btn').style.display='none';updateSidebar();}

function bindDropZone() {
  const dz=document.getElementById('drop-zone'); if(!dz) return;
  const fi=document.getElementById('file-input');
  dz.onclick=()=>fi.click();
  fi.onchange=e=>handleFile(e.target.files[0]);
  dz.ondragover=e=>{e.preventDefault();dz.classList.add('over');};
  dz.ondragleave=()=>dz.classList.remove('over');
  dz.ondrop=e=>{e.preventDefault();dz.classList.remove('over');handleFile(e.dataTransfer.files[0]);};
}
function handleFile(f){
  if(!f||f.type!=='application/pdf'){alert('PDF only');return;}
  if(f.size>5*1024*1024){alert('Max 5MB');return;}
  PD().resumeFile=f.name;
  const r=new FileReader(); r.onload=e=>{PD().resumeB64=e.target.result.split(',')[1]; const el=document.getElementById('file-chosen'); el.style.display='block'; el.textContent='✓ '+f.name+' ('+(f.size/1024).toFixed(0)+' KB)'; updateSidebar();}; r.readAsDataURL(f);
}

async function loadSheet() {
  if (!G.token){alert('Sign in first.');return;}
  const id=document.getElementById('sheet-id').value.trim();
  const tab=document.getElementById('sheet-tab').value.trim()||P().sheetTab;
  const hr=parseInt(document.getElementById('header-row').value)||1;
  if (!id){alert('Enter Sheet ID.');return;}
  G.sheetId=id; P().sheetTab=tab; G.headerRow=hr;
  const res=document.getElementById('sheet-result'); res.innerHTML='<span style="color:var(--muted)">Loading...</span>';
  try {
    const r=await gFetch(`https://sheets.googleapis.com/v4/spreadsheets/${id}/values/${encodeURIComponent(tab+'!'+hr+':'+hr)}`);
    const d=await r.json();
    if(!d.values||!d.values[0]){res.innerHTML='<span style="color:#ff6b6b">No headers found.</span>';return;}
    G.headers=d.values[0];
    res.innerHTML=`<span style="color:var(--pc)">✓ ${G.headers.length} columns found. Map them below.</span>`;
    document.getElementById('mapper-card').style.display='block';
    // Render mapper
    const fields=[{k:'company',l:'Company'},{k:'email',l:'Email'},{k:'jobtitle',l:'Job Title'},{k:'suburb',l:'Suburb'},{k:'notes',l:'Notes'},{k:'status',l:'Status (write)'},{k:'sentAt',l:'Sent At (write)'},{k:'replyStatus',l:'Reply Status'},{k:'fuStatus',l:'Follow-Up Status'},{k:'fuAt',l:'Followed Up At'}];
    const opts=['(skip)',...G.headers].map(h=>`<option value="${h}">${h}</option>`).join('');
    document.getElementById('col-mapper').innerHTML=fields.map(f=>`<div class="col-row"><span>${f.l}</span><select id="map-${f.k}" onchange="PD().colMap['${f.k}']=this.value">${opts}</select></div>`).join('');
    fields.forEach(f=>{
      const sel=document.getElementById('map-'+f.k); if(!sel) return;
      const v=PD().colMap[f.k]; if(v&&v!=='(skip)'){sel.value=v;return;}
      const m=G.headers.find(h=>{const hl=h.toLowerCase();return hl.includes(f.k.toLowerCase())||(f.k==='jobtitle'&&hl.includes('job'))||(f.k==='sentAt'&&hl.includes('sent'))||(f.k==='replyStatus'&&hl.includes('reply'))||(f.k==='fuStatus'&&hl.includes('follow')&&!hl.includes('at'))||(f.k==='fuAt'&&hl.includes('follow')&&hl.includes('at'));});
      if(m){sel.value=m;PD().colMap[f.k]=m;}
    });

}

async function refreshJobs(){
  if(!G.token||!G.sheetId) return;
  const wrap=document.getElementById('jobs-wrap'); if(wrap) wrap.innerHTML='<div style="color:var(--muted)">Loading...</div>';
  try {
    const range=`${P().sheetTab}!${G.headerRow+1}:2000`;
    const r=await gFetch(`https://sheets.googleapis.com/v4/spreadsheets/${G.sheetId}/values/${encodeURIComponent(range)}`);
    const d=await r.json();
    if(!d.values||!d.values.length){if(wrap)wrap.innerHTML='<div style="color:var(--muted);font-style:italic">No rows found.</div>';return;}
    const hi=k=>G.headers.indexOf(PD().colMap[k]);
    PD().jobs=d.values.map((row,i)=>({
      rowIdx:G.headerRow+1+i, company:row[hi('company')]||'', email:row[hi('email')]||'',
      jobtitle:row[hi('jobtitle')]||'Worker', suburb:row[hi('suburb')]||'', notes:row[hi('notes')]||'',
      status:row[hi('status')]||'', sentAt:row[hi('sentAt')]||'', replyStatus:row[hi('replyStatus')]||'',
      fuStatus:row[hi('fuStatus')]||'', fuAt:row[hi('fuAt')]||'', selJob:false, selFu:false
    }));
    renderJobsTable(); renderFuStats(); updateSidebar();
  } catch(e){if(wrap)wrap.innerHTML=`<div style="color:#ff6b6b">❌ ${e.message}</div>`;}
}

function renderFuStats(){
  const el=document.getElementById('fu-stats'); if(!el) return;
  const j=PD().jobs,due=j.filter(isFuDue).length,done=j.filter(x=>x.fuStatus&&x.fuStatus.includes('FOLLOWED')).length,skip=j.filter(isReplied).length,sel=j.filter(x=>x.selFu).length;
  el.innerHTML=sc([{n:due,l:'Due Now',c:'#ff6b6b'},{n:done,l:'Done',c:'var(--pc)'},{n:skip,l:'Skipped',c:'#74b9ff'},{n:sel,l:'Selected',c:'#ffd166'}]);
  el.style.display='grid';
}

function isSent(j){return j.status&&j.status.toUpperCase().includes('SENT');}
function isReplied(j){const r=(j.replyStatus||'').toLowerCase();return['positive','negative','replied','interview'].includes(r);}
function isFuDue(j){
  if(!isSent(j)||isReplied(j)) return false;
  if(j.fuStatus&&j.fuStatus.includes('FOLLOWED')) return false;
  if(!j.sentAt) return false;
  const days=PT().fuDays||7;
  const sent=new Date(j.sentAt); if(isNaN(sent)) return false;
  return (Date.now()-sent)/864e5>=days;
}

function statusPill(j){
  if(j.fuStatus&&j.fuStatus.includes('FOLLOWED')) return `<span class="pill pf">↑ Followed Up</span>`;
  if(isReplied(j)) return `<span class="pill p${j.replyStatus.toLowerCase().slice(0,1)==='p'?'p':j.replyStatus.toLowerCase().slice(0,1)==='i'?'i':j.replyStatus.toLowerCase().slice(0,1)==='n'?'r':'f'}">${j.replyStatus}</span>`;
  if(isSent(j)) return `<span class="pill pp">✓ Sent</span>`;
  if(!j.email) return `<span class="pill pm">No Email</span>`;
  return `<span class="pill pw">Pending</span>`;
}
function replyPill(r){
  if(!r) return '<span style="color:var(--muted);font-size:0.74rem">—</span>';
  const map={positive:'pp',negative:'pr',replied:'pf',interview:'pi'};
  return `<span class="pill ${map[r.toLowerCase()]||'pm'}">${r}</span>`;
}

function selPending(){PD().jobs.forEach((j,i)=>{if(!isSent(j)&&j.email&&!isReplied(j)){j.selJob=true;const c=document.querySelector(`#jr-${i} input`);if(c)c.checked=true;}});renderJobStats();}
function deselAll(){PD().jobs.forEach((j,i)=>{j.selJob=false;const c=document.querySelector(`#jr-${i} input`);if(c)c.checked=false;});renderJobStats();}
function selDue(){PD().jobs.forEach((j,i)=>{if(isFuDue(j)){j.selFu=true;const c=document.querySelector(`#fur-${i} input`);if(c)c.checked=true;}});renderFuStats();}
function deselFu(){PD().jobs.forEach((j,i)=>{j.selFu=false;const c=document.querySelector(`#fur-${i} input`);if(c)c.checked=false;});renderFuStats();}

async function sendAll(){
  const toSend=PD().jobs.filter(j=>j.selJob&&j.email);
  if(!toSend.length) return;
  document.getElementById('send-pre').style.display='none';
  document.getElementById('send-prog').style.display='block';
  const log=document.getElementById('send-log'); log.style.display='block'; log.innerHTML='';
  let sent=0,failed=0;
  for(let i=0;i<toSend.length;i++){
    const j=toSend[i];
    setPB('send-bar',i,toSend.length); setLbl('send-lbl',`Sending ${i+1}/${toSend.length}: ${j.company}`);
    logL(log,`→ ${j.company} (${j.email})...`,'linf');
    try{
      const subj=personalise(PT().subject,j), body=personalise(PT().body,j).replace(/\[YOUR_NAME\]/g,PT().name).replace(/\[YOUR_PHONE\]/g,PT().phone);
      await gmailSend(j.email,subj,body,true);
      const ts=new Date().toLocaleString('en-AU');
      await sheetWrite(j.rowIdx,[{col:PD().colMap.status,val:'SENT ✓'},{col:PD().colMap.sentAt,val:ts}]);
      const idx=PD().jobs.indexOf(j); if(idx>=0){PD().jobs[idx].status='SENT ✓';PD().jobs[idx].sentAt=ts;PD().jobs[idx].selJob=false;}
      PD().history.push({type:'Application',...j,ts}); logL(log,`✓ Sent → ${j.company}`,'lok'); sent++;
    }catch(e){logL(log,`✗ Failed: ${j.company} — ${e.message}`,'lerr');failed++;}
    await sleep(1200);
  }
  setPB('send-bar',1,1);
  document.getElementById('send-done').style.display='block';
  document.getElementById('send-done-stats').innerHTML=sc([{n:sent,l:'Sent',c:'var(--pc)'},{n:failed,l:'Failed',c:'#ff6b6b'}]);
  updateSidebar();
}

async function sendFollowUps(){
  const toSend=PD().jobs.filter(j=>j.selFu&&j.email&&isFuDue(j));
  if(!toSend.length) return;
  document.getElementById('fu-pre').style.display='none';
  document.getElementById('fu-prog').style.display='block';
  const log=document.getElementById('fu-log'); log.style.display='block'; log.innerHTML='';
  let sent=0,failed=0;
  for(let i=0;i<toSend.length;i++){
    const j=toSend[i];
    setPB('fu-bar',i,toSend.length); setLbl('fu-lbl',`${i+1}/${toSend.length}: ${j.company}`);
    if(isReplied(j)){logL(log,`⊘ Skipped: ${j.company} (${j.replyStatus})`,'lsk');continue;}
    try{
      const da=Math.floor((Date.now()-new Date(j.sentAt))/864e5);
      const subj=personalise(PT().fuSubject,j), body=personalise(PT().fuBody,j).replace(/\{days\}/gi,da).replace(/\[YOUR_NAME\]/g,PT().name).replace(/\[YOUR_PHONE\]/g,PT().phone);
      await gmailSend(j.email,subj,body,false);
      const ts=new Date().toLocaleString('en-AU');
      await sheetWrite(j.rowIdx,[{col:PD().colMap.fuStatus,val:'FOLLOWED UP ✓'},{col:PD().colMap.fuAt,val:ts}]);
      const idx=PD().jobs.indexOf(j); if(idx>=0){PD().jobs[idx].fuStatus='FOLLOWED UP ✓';PD().jobs[idx].fuAt=ts;PD().jobs[idx].selFu=false;}
      PD().history.push({type:'Follow-Up',...j,ts}); logL(log,`✓ Followed up → ${j.company}`,'lok'); sent++;
    }catch(e){logL(log,`✗ Failed: ${j.company} — ${e.message}`,'lerr');failed++;}
    await sleep(1200);
  }
  setPB('fu-bar',1,1);
  document.getElementById('fu-done').style.display='block';
  document.getElementById('fu-done-stats').innerHTML=sc([{n:sent,l:'Sent',c:'#ffd166'},{n:failed,l:'Failed',c:'#ff6b6b'}]);
  updateSidebar();
}

function renderTracker(){
  const el=document.getElementById('tracker-content'); if(!el) return;
  const allJobs=G.pd.flatMap(pd=>pd.jobs);
  const total=allJobs.filter(isSent).length;
  if(!total){el.innerHTML='<div style="color:var(--muted);font-style:italic">Send applications first.</div>';return;}
  const cats=[
    {l:'Positive',c:'#4fffb0'},{l:'Interview',c:'#ffd166'},{l:'Replied',c:'#74b9ff'},
    {l:'Negative',c:'#ff6b6b'},{l:'Followed Up',c:'#a29bfe'},{l:'No Reply',c:'#555570'}
  ];
  const cnt=(jobs,cat)=>{
    if(cat==='Followed Up') return jobs.filter(j=>j.fuStatus&&j.fuStatus.includes('FOLLOWED')).length;
    if(cat==='No Reply') return jobs.filter(j=>isSent(j)&&!isReplied(j)&&!(j.fuStatus&&j.fuStatus.includes('FOLLOWED'))).length;
    return jobs.filter(j=>(j.replyStatus||'').toLowerCase()===cat.toLowerCase()).length;
  };
  const rate=total?Math.round((cnt(allJobs,'Positive')+cnt(allJobs,'Interview'))/total*100):0;
  let html=`<div class="stats-row" style="grid-template-columns:repeat(3,1fr);margin-bottom:18px;">
    <div class="stat-card"><span class="num" style="color:var(--pc)">${total}</span><span class="lbl">Total Sent</span></div>
    <div class="stat-card"><span class="num" style="color:#ffd166">${rate}%</span><span class="lbl">Positive Rate</span></div>
    <div class="stat-card"><span class="num" style="color:#ff6b6b">${G.pd.reduce((a,pd)=>a+pd.jobs.filter(isFuDue).length,0)}</span><span class="lbl">Follow-Ups Due</span></div>
  </div>
  <div class="card tracker-section">
    <h3 style="color:var(--pc)">Combined — All Profiles</h3>
    ${cats.map(c=>`<div class="tracker-bar-row">
      <div class="tracker-bar-label" style="color:${c.c}">${c.l}</div>
      <div class="tracker-bar-track"><div class="tracker-bar-fill" style="width:${total?cnt(allJobs,c.l)/total*100:0}%;background:${c.c}"></div></div>
      <div class="tracker-bar-count" style="color:${c.c}">${cnt(allJobs,c.l)}</div>
    </div>`).join('')}
  </div>`;
  G.profiles.forEach((p,i)=>{
    const jobs=G.pd[i].jobs; const ptotal=jobs.filter(isSent).length; if(!ptotal) return;
    html+=`<div class="card tracker-section">
      <h3 style="color:${p.color}">${p.icon} ${p.name} (${ptotal} sent)</h3>
      ${cats.map(c=>`<div class="tracker-bar-row">
        <div class="tracker-bar-label" style="color:${c.c}">${c.l}</div>
        <div class="tracker-bar-track"><div class="tracker-bar-fill" style="width:${ptotal?cnt(jobs,c.l)/ptotal*100:0}%;background:${c.c}"></div></div>
        <div class="tracker-bar-count" style="color:${c.c}">${cnt(jobs,c.l)}</div>
      </div>`).join('')}
    </div>`;
  });
  el.innerHTML=html;
}

async function gmailSend(to,subject,body,attach){
  const bnd='bnd_'+Math.random().toString(36).substr(2);
  const from=PT().name?`${PT().name} <${G.userEmail}>`:G.userEmail;
  const parts=[`From: ${from}`,`To: ${to}`,`Subject: ${subject}`,`MIME-Version: 1.0`,`Content-Type: multipart/mixed; boundary="${bnd}"`,``,`--${bnd}`,`Content-Type: text/plain; charset="UTF-8"`,``,body,``];
  if(attach&&PD().resumeB64){parts.push(`--${bnd}`,`Content-Type: application/pdf; name="${PD().resumeFile}"`,`Content-Disposition: attachment; filename="${PD().resumeFile}"`,`Content-Transfer-Encoding: base64`,``,PD().resumeB64,``);}
  parts.push(`--${bnd}--`);
  const raw=btoa(unescape(encodeURIComponent(parts.join('\r\n')))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
  const r=await gFetch('https://gmail.googleapis.com/gmail/v1/users/me/messages/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({raw})});
  if(!r.ok){const e=await r.json();throw new Error(e.error?.message||'Gmail error');}
}

async function sheetWrite(rowIdx,colVals){
  const data=colVals.filter(cv=>cv.col&&cv.col!=='(skip)').map(cv=>({range:`${P().sheetTab}!${colLetter(G.headers.indexOf(cv.col))}${rowIdx}`,values:[[cv.val]]}));
  if(!data.length) return;
  await gFetch(`https://sheets.googleapis.com/v4/spreadsheets/${G.sheetId}/values:batchUpdate`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({valueInputOption:'USER_ENTERED',data})});
}

// ══════════════════════════════════════════════════════
// HELPERS
// ══════════════════════════════════════════════════════
function personalise(t,j){return(t||'').replace(/\{company\}/gi,j.company).replace(/\{jobtitle\}/gi,j.jobtitle).replace(/\{suburb\}/gi,j.suburb).replace(/\{notes\}/gi,j.notes);}
function colLetter(i){let s='';i++;while(i>0){let r=(i-1)%26;s=String.fromCharCode(65+r)+s;i=Math.floor((i-1)/26);}return s;}
async function gFetch(url,opts={}){return fetch(url,{...opts,headers:{Authorization:'Bearer '+G.token,...(opts.headers||{})}});}
function logL(el,msg,cls){el.innerHTML+=`<div class="${cls}">${msg}</div>`;el.scrollTop=el.scrollHeight;}
function sleep(ms){return new Promise(r=>setTimeout(r,ms));}
function val(id){const el=document.getElementById(id);return el?el.value:'';}
function setPB(id,i,total){const el=document.getElementById(id);if(el)el.style.width=Math.round(i/total*100)+'%';}
function setLbl(id,t){const el=document.getElementById(id);if(el)el.textContent=t;}
function sc(arr){return`<div class="stats-row" style="grid-template-columns:repeat(${arr.length},1fr)">${arr.map(s=>`<div class="stat-card"><span class="num" style="color:${s.c}">${s.n}</span><span class="lbl">${s.l}</span></div>`).join('')}</div>`;}
function downloadTemplate(){
  const csv=`Company,Email,Job Title,Suburb,Notes,Status,Sent At,Reply Status,Follow Up Status,Followed Up At\nExample Company,hr@example.com.au,Support Worker,Dandenong,,,,,\n`;
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='jobsend-template.csv';a.click();
}
